<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family-Awards</title>
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
<header class="main__header">

</header>

<!-- Main -->
<main class="main__content">
    
<!-- Corners -->
    <div class="corners">
        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>
    </div>

    <!-- Hero Section -->
    <section class="hero__section">

        <div class="blob__container">

        <div class="blob"></div>

            <div class="blob__text">
                <span class="blob__awards">
                    ANNUAL AWARDS
                </span>
                <h1 class="blob__title">
                    НОМИНАЦИИ <span>2026</span>
                </h1>
                <p class="blob__sub">
                    Отдай свой голос за тех, кто сделал этот год особенным.
                </p>
                <a href="#" class="vote__btn">
                    ГОЛОСОВАТЬ
                </a>
                </div>
            </div>

            <div class="fam__text">Family</div>

            <div class="year__text">2026</div>

    </section>
</main>

<!-- Footer -->
<footer class="main__footer">

    <div class="footer__copy">
        &copy; 2026 Family Awards. All rights reserved.
    </div>

</footer>

</body>
</html>
