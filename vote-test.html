<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Vote API Test</title>
</head>

<body>

    <h1>Тест голосования</h1>

    <button id="voteButton">
        Проголосовать за Alex
    </button>

    <pre id="result"></pre>


    <script>

        const button = document.getElementById("voteButton");
        const result = document.getElementById("result");


        button.addEventListener("click", async () => {

            try {

                const response = await fetch("/api/vote", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        nomination: "Лучший игрок",
                        vote: "Alex"
                    })

                });


                const data = await response.json();

                result.textContent =
                    JSON.stringify(data, null, 2);

            } catch (error) {

                result.textContent =
                    "Ошибка: " + error.message;

            }

        });

    </script>

</body>
</html>
