<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026</title>
    <!-- CSS -->
    <link rel="stylesheet" href="2026.css">
</head>
<body>

    <!-- Header -->
<header class="main__header">
    <nav class="user__nav">
        <ul class="nav__list">
            <li class="nav__link prev__year">
                <a href="#">
                    <img src="img/2026/2025.png" alt="2025">
                </a>
            </li>
            <li class="nav__link active__year">
                <a href="#">
                    <img src="img/2026/home.png" alt="2026">
                </a>
            </li>
            <li class="nav__link next__year">
                <a href="#">
                    <img src="img/2026/2027.png" alt="2027">
                </a>
            </li>
        </ul>
    </nav>
</header>

<!-- Main -->
<main class="main__content">
    <div class="main__title">
        <img src="img/2026/main__hero.png" alt="">
    </div>

    <section class="hero__section">
        <div class="hero__text">
            
        </div>

        <div class="hero__btn">
            <a href="#abc">
                <img src="img/2026/down.png" alt="hero_btn">
            </a>
        </div>
    </section>
    

    <div class="abc" id="abc">
            <section class="nomination-marquee">
        <div class="marquee-track">

            <a href="#tournament" class="marquee-item">🏆 Турнир года</a>
            <a href="#player" class="marquee-item">⭐ Игрок года</a>
            <a href="#moment" class="marquee-item">🎮 Момент года</a>
            <a href="#team" class="marquee-item">🔥 Команда года</a>
            <a href="#commentator" class="marquee-item">🎤 Комментатор года</a>
            <a href="#discovery" class="marquee-item">💎 Открытие года</a>

        </div>
    </section>

        <section class="vote__section" id="vote">
        <div class="vote__text">
            <img src="img/2026/vote_text.png" alt="Vote__text" class="vote__text1">
            <img src="img/2026/vote_text2.png" alt="Vote__text" class="vote__text2">
        </div>
    </section>

    <section class="nomination" id="tournament">

    <h2 class="nomination-title">
        <img src="img/2026/tur-2026.png" alt="">
    </h2>
    <hr class="nomination__hr">

    <div class="cards-container">

        <input type="radio" name="tournament-of-year" id="tour1" hidden>
        <label class="card" for="tour1">
            <img src="img/2026/Rematch.png" alt="">
            <h3>REMATCH TO MATCH</h3>
            <p>Турнир по игре REMATCH.</p>
            <button type="button" class="more-btn">
                Узнать больше
            </button>
        </label>

        <input type="radio" name="tournament-of-year" id="tour2" hidden>
        <label class="card" for="tour2">
            <img src="img/2026/fifa.png" alt="">
            <h3>DWC 2026</h3>
            <p>Турнир по игре FC26</p>
            <button type="button" class="more-btn">
                Узнать больше
            </button>
        </label>

        <input type="radio" name="tournament-of-year" id="tour3" hidden>
        <label class="card" for="tour3">
            <img src="img/2026/games.png" alt="">
            <h3>Stay Alive</h3>
            <p>Лига лучших игроков сезона.</p>
            <button type="button" class="more-btn">
                Узнать больше
            </button>
        </label>

        <input type="radio" name="tournament-of-year" id="tour4" hidden>
        <label class="card" for="tour4">
            <img src="img/2026/liarsbar.jpg" alt="">
            <h3>Liars-Bar</h3>
            <p>Лига лучших игроков сезона.</p>
            <button type="button" class="more-btn">
                Узнать больше
            </button>
        </label>

    </div>

</section>
    </div>
</main>

<!-- Footer -->

     <div class="footer__copy">
        &copy; 2026 Family Awards. All rights reserved.
    </div>
</footer> -->

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/Draggable.min.js"></script>

<script src="marquee.js"></script>
<script src="script.js"></script>

</body>
</html>
